name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check extension with the committed lockfile
        run: cargo check --locked

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run pre-commit hooks
        uses: j178/prek-action@v3.1.0
        with:
          # Follow the prek version bundled with the action (updated by Renovate).
          prek-version: latest-known
          # no-commit-to-branch fails on pushes to main.
          extra-args: --all-files --skip=no-commit-to-branch
